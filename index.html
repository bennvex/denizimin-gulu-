<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif}

#question{
position:fixed;inset:0;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:18px;
background:radial-gradient(circle at 50% 25%,#ffd8e6,#ffc1d7 45%,#f7a9c5);
text-align:center;z-index:10
}

#question video{
width:min(82vw,340px);max-height:45vh;object-fit:contain;
border-radius:24px;box-shadow:0 14px 35px rgba(120,40,70,.18);
background:#fff
}

.questionText{margin:0;color:#8d3156;font-size:25px;font-weight:700}

.buttons{display:flex;gap:14px;justify-content:center;align-items:center}

button{
border:0;padding:13px 28px;border-radius:999px;font-size:17px;
font-weight:bold;cursor:pointer;box-shadow:0 7px 18px rgba(100,30,60,.18)
}

.yes{background:#73b77a;color:white}
.no{background:#ef6f91;color:white}

#roseScreen{
position:fixed;inset:0;display:none;align-items:center;justify-content:center;
flex-direction:column;
background:radial-gradient(circle at 50% 35%,#fffaf4,#fff0e8 38%,#f9dce1)
}

.scene{position:relative;width:270px;height:405px}

.glass{
position:absolute;left:50%;top:12px;width:225px;height:345px;
transform:translateX(-50%);
border:2px solid rgba(255,255,255,.72);
border-bottom:3px solid rgba(255,255,255,.88);
border-radius:112px 112px 32px 32px / 105px 105px 28px 28px;
background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,.05) 25%,rgba(255,255,255,.02) 70%,rgba(255,255,255,.22));
box-shadow:inset 8px 0 14px rgba(255,255,255,.28),inset -8px 0 14px rgba(255,255,255,.12),0 22px 45px rgba(130,65,80,.15);
backdrop-filter:blur(2px);z-index:1
}

.glass:before{
content:"";position:absolute;top:28px;left:25px;width:18px;height:220px;
border-radius:50%;background:linear-gradient(to bottom,rgba(255,255,255,.55),rgba(255,255,255,0));
transform:rotate(8deg)
}

.knob{
position:absolute;top:0;left:50%;transform:translateX(-50%);
width:28px;height:13px;border-radius:50%;
background:radial-gradient(circle at 35% 30%,#fff,#ead8c8 55%,#cdb9a8);
box-shadow:0 3px 8px rgba(100,70,60,.18);z-index:4
}

.base{
position:absolute;left:50%;bottom:37px;transform:translateX(-50%);
width:188px;height:22px;border-radius:50%;
background:linear-gradient(#f3dfd2,#d9bba9);
box-shadow:0 8px 16px rgba(100,55,50,.17),inset 0 2px 4px rgba(255,255,255,.65);
z-index:3
}

.plant{
position:absolute;left:50%;bottom:51px;width:130px;height:245px;
transform:translateX(-50%);z-index:2
}

.soil{
position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);
width:116px;height:28px;border-radius:50%;
background:radial-gradient(ellipse at center,#9c7159,#7e5948 70%);
box-shadow:inset 0 4px 5px rgba(255,255,255,.16),0 2px 4px rgba(70,40,30,.15);
z-index:4
}

.stem{
position:absolute;left:63px;bottom:9px;width:4px;height:180px;
transform:translateX(-50%);border-radius:10px;
background:linear-gradient(90deg,#426d39,#6d9a57,#365f32);
z-index:2
}

.leaf{
position:absolute;width:43px;height:19px;
background:linear-gradient(135deg,#719c59,#416d3b);
border-radius:100% 0 100% 0;
z-index:3
}

.leftLeaf{left:25px;bottom:78px;transform:rotate(-25deg)}
.rightLeaf{left:61px;bottom:116px;transform:rotate(28deg) scaleX(.9)}

.rose{
position:absolute;left:63px;bottom:111px;width:78px;height:78px;
transform:translateX(-50%);z-index:5;
filter:drop-shadow(0 7px 8px rgba(100,30,35,.16));
animation:roseBreath 3.5s ease-in-out infinite
}

@keyframes roseBreath{
0%,100%{transform:translateX(-50%) scale(1)}
50%{transform:translateX(-50%) scale(1.035)}
}

.petal{
position:absolute;
background:radial-gradient(circle at 35% 25%,#ff9fa8,#ed4057 42%,#b71936 78%,#81152d);
box-shadow:inset 2px 2px 5px rgba(255,255,255,.18);
z-index:4
}

.p1{width:42px;height:50px;left:2px;top:21px;border-radius:70% 35% 65% 40%;transform:rotate(-32deg)}
.p2{width:43px;height:51px;right:1px;top:18px;border-radius:35% 70% 40% 65%;transform:rotate(35deg)}
.p3{width:48px;height:43px;left:15px;top:2px;border-radius:50% 50% 40% 40%}
.p4{width:45px;height:39px;left:0;top:5px;border-radius:60% 35% 55% 40%;transform:rotate(-12deg)}
.p5{width:44px;height:40px;right:0;top:4px;border-radius:35% 60% 40% 55%;transform:rotate(12deg)}

.inner{
position:absolute;left:19px;top:14px;width:40px;height:45px;
border-radius:50% 50% 45% 45%;
background:linear-gradient(135deg,#ff6977,#c51e3d);
transform:rotate(-5deg);z-index:6
}

.roseCenter{
position:absolute;left:50%;top:50%;width:20px;height:22px;
transform:translate(-50%,-50%);border-radius:50%;
background:radial-gradient(circle at 35% 30%,#ffb0b0,#d8324d 45%,#8f172f);
z-index:8
}

.fallen{
position:absolute;width:9px;height:13px;border-radius:80% 20% 80% 20%;
background:linear-gradient(135deg,#f45a68,#b91c38);
opacity:0;z-index:20;pointer-events:none
}

.f1{left:8px;top:49px;animation:fall1 4.8s ease-in-out infinite}
.f2{left:54px;top:45px;animation:fall2 5.4s ease-in-out infinite 1.5s}
.f3{left:31px;top:58px;animation:fall3 5s ease-in-out infinite 3s}

@keyframes fall1{
0%,12%{opacity:0;transform:translate(0,0) rotate(0) scale(.7)}
18%{opacity:.95}
45%{transform:translate(-9px,42px) rotate(110deg)}
72%{transform:translate(12px,94px) rotate(230deg)}
100%{opacity:0;transform:translate(22px,145px) rotate(360deg) scale(.55)}
}

@keyframes fall2{
0%,12%{opacity:0;transform:translate(0,0) rotate(0) scale(.7)}
18%{opacity:.9}
45%{transform:translate(14px,35px) rotate(-100deg)}
75%{transform:translate(3px,100px) rotate(-220deg)}
100%{opacity:0;transform:translate(-12px,150px) rotate(-360deg) scale(.5)}
}

@keyframes fall3{
0%,12%{opacity:0;transform:translate(0,0) rotate(0) scale(.7)}
20%{opacity:.9}
48%{transform:translate(-17px,40px) rotate(120deg)}
75%{transform:translate(-5px,92px) rotate(250deg)}
100%{opacity:0;transform:translate(15px,142px) rotate(360deg) scale(.5)}
}

.title{
position:absolute;left:50%;bottom:-4px;transform:translateX(-50%);
width:100%;text-align:center;color:#8f4058;
font-family:Georgia,serif;font-size:27px;font-weight:bold;
text-shadow:0 2px 8px rgba(120,50,70,.12)
}

.subtitle{
position:absolute;left:50%;bottom:-31px;transform:translateX(-50%);
width:100%;text-align:center;color:#b27787;
font-family:Georgia,serif;font-size:13px;font-style:italic
}
</style>
</head>

<body>

<div id="question">

<video autoplay muted loop playsinline
src="https://raw.githubusercontent.com/bennvex/denizimin-gulu-/main/ScreenRecording_09-28-2026%2011-46-12_1.mov">
</video>

<h1 class="questionText">Flowers For You? 🌷</h1>

<div class="buttons">
<button class="yes" onclick="openRose()">YES 🌹</button>
<button class="no" onclick="runAway(this)">NO 😭</button>
</div>

</div>

<div id="roseScreen">

<div class="scene">

<div class="knob"></div>
<div class="glass"></div>

<div class="plant">

<div class="stem"></div>

<div class="leaf leftLeaf"></div>
<div class="leaf rightLeaf"></div>

<div class="rose">

<div class="petal p1"></div>
<div class="petal p2"></div>
<div class="petal p3"></div>
<div class="petal p4"></div>
<div class="petal p5"></div>

<div class="inner"></div>
<div class="roseCenter"></div>

<div class="fallen f1"></div>
<div class="fallen f2"></div>
<div class="fallen f3"></div>

</div>

<div class="soil"></div>

</div>

<div class="base"></div>

<div class="title">Deniz’imin Gülü 🌹</div>
<div class="subtitle">Senin için, küçücük bir fanusun içinde kocaman bir sevgi.</div>

</div>

</div>

<script>
function openRose(){
document.getElementById("question").style.display="none";
document.getElementById("roseScreen").style.display="flex";
}

function runAway(button){
const padding=20;
const maxX=window.innerWidth-button.offsetWidth-padding;
const maxY=window.innerHeight-button.offsetHeight-padding;
const x=Math.max(padding,Math.random()*maxX);
const y=Math.max(padding,Math.random()*maxY);
button.style.position="fixed";
button.style.left=x+"px";
button.style.top=y+"px";
}
</script>

</body>
</html>
